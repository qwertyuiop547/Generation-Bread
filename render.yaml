# Generation Bread — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Deploys:
#   1) generation-bread-api   — Django + Daphne (WebSockets)
#   2) generation-bread-web  — Next.js frontend
#   3) generation-bread-redis
#   4) generation-bread-db   — Postgres
#
# After first deploy, set DJANGO_ALLOWED_HOSTS / CORS / CSRF to your
# *.onrender.com hostnames (or custom domains), then redeploy.

services:
  - type: web
    name: generation-bread-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: SECURE_SSL
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: generation-bread-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: generation-bread-redis
          type: keyvalue
          property: connectionString
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: WS_MAX_CONNECTIONS_PER_PROCESS
        value: "800"
      - key: WS_MAX_CONNECTIONS_GLOBAL
        value: "5000"
      - key: RATE_LIMIT_IP_REQUESTS
        value: "600"
      - key: MENU_CACHE_SECONDS
        value: "30"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  - type: web
    name: generation-bread-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          name: generation-bread-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AUTH_URL
        fromService:
          name: generation-bread-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXTAUTH_URL
        fromService:
          name: generation-bread-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AUTH_TRUST_HOST
        value: "true"

  - type: keyvalue
    name: generation-bread-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: generation-bread-db
    plan: free
    postgresMajorVersion: "16"
