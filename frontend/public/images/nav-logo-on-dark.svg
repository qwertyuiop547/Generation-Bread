<svg width="240" height="56" viewBox="0 0 240 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Emblem Gradient -->
    <linearGradient id="badgeGradDarkTeal" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064043" />
      <stop offset="100%" stop-color="#032527" />
    </linearGradient>

    <!-- Bright Teal Gradient for Dark Scrim -->
    <linearGradient id="brightTealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#098086" />
    </linearGradient>

    <!-- Crisp White/Cream Gradient -->
    <linearGradient id="whiteCreamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9F9" />
    </linearGradient>

    <!-- Shadow for High Contrast on Dark/Video -->
    <filter id="shadowDarkTeal" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Signature Teal Croissant Emblem Badge -->
  <g filter="url(#shadowDarkTeal)">
    <rect x="4" y="4" width="48" height="48" rx="14" fill="url(#badgeGradDarkTeal)" stroke="#2DD4BF" stroke-width="1.5" stroke-opacity="0.8" />
    
    <!-- Croissant Icon in Glowing Teal -->
    <g transform="translate(10, 10) scale(0.0703)" stroke="#2DD4BF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 142 278 C 142 196 190 172 256 172 C 322 172 370 196 370 278 C 370 298 356 312 344 300 C 324 280 300 274 276 274 L 236 274 C 212 274 188 280 168 300 C 156 312 142 298 142 278 Z" />
      <path d="M 160 238 C 178 254 196 266 214 274" />
      <path d="M 218 178 L 236 274" />
      <path d="M 294 178 L 276 274" />
      <path d="M 352 238 C 334 254 316 266 298 274" />
    </g>
  </g>

  <!-- Typography: GENERATION BREAD -->
  <g filter="url(#shadowDarkTeal)">
    <text x="62" y="27" fill="url(#whiteCreamGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="16" font-weight="900" letter-spacing="1.2">
      GENERATION
    </text>
    
    <text x="180" y="27" fill="url(#brightTealGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="16" font-weight="900" letter-spacing="1.2">
      BREAD
    </text>

    <!-- Subtitle Caption -->
    <text x="63" y="43" fill="#2DD4BF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="8.5" font-weight="800" letter-spacing="2.4" text-transform="uppercase" opacity="0.95">
      BOUTIQUE BAKERY &amp; CAFE
    </text>
  </g>
</svg>
