<svg width="240" height="56" viewBox="0 0 240 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badgeGradSky" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F4C81" />
      <stop offset="100%" stop-color="#082947" />
    </linearGradient>

    <linearGradient id="goldGradSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D09D" />
      <stop offset="50%" stop-color="#E3A458" />
      <stop offset="100%" stop-color="#B87333" />
    </linearGradient>

    <linearGradient id="darkTextGradSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F4C81" />
      <stop offset="100%" stop-color="#082947" />
    </linearGradient>

    <filter id="badgeShadowSky" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F4C81" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Luxury Croissant Emblem Badge -->
  <g filter="url(#badgeShadowSky)">
    <rect x="4" y="4" width="48" height="48" rx="14" fill="url(#badgeGradSky)" stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.6" />
    
    <!-- Mini Croissant Icon Inside Badge -->
    <g transform="translate(10, 10) scale(0.0703)" stroke="url(#goldGradSky)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 142 278 C 142 196 190 172 256 172 C 322 172 370 196 370 278 C 370 298 356 312 344 300 C 324 280 300 274 276 274 L 236 274 C 212 274 188 280 168 300 C 156 312 142 298 142 278 Z" />
      <path d="M 160 238 C 178 254 196 266 214 274" />
      <path d="M 218 178 L 236 274" />
      <path d="M 294 178 L 276 274" />
      <path d="M 352 238 C 334 254 316 266 298 274" />
    </g>
  </g>

  <!-- Typography: GENERATION BREAD -->
  <text x="62" y="27" fill="url(#darkTextGradSky)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="16" font-weight="900" letter-spacing="1.2">
    GENERATION
  </text>
  
  <text x="180" y="27" fill="url(#goldGradSky)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="16" font-weight="900" letter-spacing="1.2">
    BREAD
  </text>

  <!-- Subtitle Caption -->
  <text x="63" y="43" fill="#2563EB" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="8.5" font-weight="800" letter-spacing="2.4" text-transform="uppercase">
    BOUTIQUE BAKERY &amp; CAFE
  </text>
</svg>
